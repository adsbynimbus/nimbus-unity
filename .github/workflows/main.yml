name: Build and Test Native Projects

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  buildPlatforms:
    name: Build for ${{ matrix.targetPlatform }} with Unity Version ${{ matrix.unityVersion }}✨
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - sample-app
        targetPlatform:
          - Android # Build an Android player.
          - iOS # Build an iOS player.
        unityVersion:
          - 6000.5.0f1
          - auto
    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
      # Cache
      - uses: actions/cache@v4
        with:
          path: sample-app/Library
          key: Library-${{ matrix.targetPlatform }}-${{ matrix.unityVersion }}-${{ hashFiles('sample-app/Assets/**', 'sample-app/Packages/**', 'sample-app/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-${{ matrix.unityVersion }}-
            Library-${{ matrix.targetPlatform }}-
            Library-test-${{ hashFiles('sample-app/Assets/**', 'sample-app/Packages/**', 'sample-app/ProjectSettings/**') }}
            Library-
      # Rename file so build picks it up
      - name: Rename nimbus.rsp to csc.rsp
        run: cp -f sample-app/Assets/nimbus.rsp sample-app/Assets/csc.rsp
      # Apply Pre Processor Symbols (Compiler options)
      - name: Apply csc.rsp (pre-processor symbols)
        run: echo -define:MY_SYMBOL >> sample-app/Assets/csc.rsp
      - name: Ensure plugin directory exist
        run: mkdir -p sample-app/Assets/Plugins/${{ matrix.targetPlatform }}
      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          projectPath: ${{ matrix.projectPath }}
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
  build-unity:
    name: Export Xcode Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: sample-app/Library
          key: Library-iOS-auto-${{ hashFiles('sample-app/Assets/**', 'sample-app/Packages/**', 'sample-app/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-auto-
            Library-iOS-
            Library-test-${{ hashFiles('sample-app/Assets/**', 'sample-app/Packages/**', 'sample-app/ProjectSettings/**') }}
            Library-
          
      # Rename file so build picks it up
      - name: Rename nimbus.rsp to csc.rsp
        run: cp -f sample-app/Assets/nimbus.rsp sample-app/Assets/csc.rsp
      # Apply Pre Processor Symbols (Compiler options)
      - name: Apply csc.rsp (pre-processor symbols)
        run: echo -define:MY_SYMBOL >> sample-app/Assets/csc.rsp

      - name: Export iOS Xcode Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildName: iOS-Build
          buildsPath: builds
          unityVersion: auto
          projectPath: sample-app
          allowDirtyBuild: true
          # Unity natively exports to an Xcode project for iOS, so no extra flags are needed.
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Project
          path: builds/iOS/iOS-Build
          retention-days: 1
